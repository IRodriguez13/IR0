# IR0 test suite catalog — consumed by scripts/test_runner.py and scripts/test_tui.py
# Only targets that exist in the lean root Makefile belong here.

suites:
  # --- Fast / CTR ---
  - id: host
    group: ctr
    label: "Fast gate (kernel + arch-guard + host + ktm-check)"
    make: test-fast
    default: true

  - id: ktest
    group: ctr
    label: "In-kernel ktests (QEMU boot)"
    make: ktest
    default: true

  - id: ctr
    group: ctr
    label: "CTR gates (kernel + arch-guard + matrix-min + host)"
    make: ctr

  - id: memsafe
    group: ctr
    label: "Kernel memsafe (Valgrind host build)"
    make: kernel-memsafe

  - id: agent-fast
    group: ctr
    label: "Fast gate + in-kernel ktests"
    make: agent-fast

  # --- KTM ---
  - id: ktm-check
    group: ktm
    label: "KTM check (host + classify + manifest)"
    make: ktm-check

  - id: ktm-manifest
    group: ktm
    label: "KTM manifest inventory"
    make: ktm-manifest

  # --- Harnesses / health ---
  - id: harnesses
    group: health
    label: "Build test kernel + host harnesses"
    make: tests

  - id: health
    group: health
    label: "Health (analyze + memsafe + ktests)"
    make: health
