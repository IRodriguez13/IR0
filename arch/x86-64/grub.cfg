set timeout=5
set default=0

menuentry "IR0 Kernel v0.0.1 (Framebuffer 1280x800)" {
    set gfxpayload=1280x800x32
    multiboot /boot/kernel-x64.bin ir0.loglevel=normal
    boot
}

menuentry "IR0 Kernel v0.0.1 (Framebuffer 1024x768)" {
    set gfxpayload=1024x768x32
    multiboot /boot/kernel-x64.bin ir0.loglevel=normal
    boot
}

menuentry "IR0 Kernel - Text mode (80x25)" {
    set gfxpayload=text
    multiboot /boot/kernel-x64.bin ir0.loglevel=normal
    boot
}

menuentry "IR0 Kernel - Framebuffer/Doom (1024x768)" {
    set gfxpayload=1024x768x32
    multiboot /boot/kernel-x64.bin ir0.loglevel=normal
    boot
}

menuentry "IR0 Kernel - Debug" {
    multiboot /boot/kernel-x64.bin ir0.loglevel=debug
    set gfxpayload=text
    boot
}

menuentry "IR0 Kernel - Trace" {
    multiboot /boot/kernel-x64.bin ir0.loglevel=trace ir0.trace=open_abi,vfs
    set gfxpayload=text
    boot
}

menuentry "IR0 Kernel - Safe Mode" {
    multiboot /boot/kernel-x64.bin ir0.loglevel=quiet --safe
    set gfxpayload=text
    boot
}

menuentry "IR0 Kernel - Recovery (local console)" {
    multiboot /boot/kernel-x64.bin ir0.recovery=1 ir0.loglevel=normal
    set gfxpayload=text
    boot
}
