# IR0 test suite catalog — consumed by scripts/test_runner.py and scripts/test_tui.py
# Only the public daily/CI gates belong here. Suite ids are independent of the
# make target they invoke.

suites:
  - id: host
    group: daily
    label: "Host and KTM gate"
    make: test-fast
    default: true

  - id: ktest
    group: daily
    label: "In-kernel tests in QEMU"
    make: kernel-tests
    default: true

  - id: ctr
    group: daily
    label: "Merge gate (kernel, guard, daily matrix, host)"
    make: ctr

  - id: matrix
    group: ci
    label: "Full config matrix"
    make: build-matrix-full
